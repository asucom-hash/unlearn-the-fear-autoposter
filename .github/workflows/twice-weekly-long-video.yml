name: Twice-weekly Unlearn The Fear reflection

on:
  schedule:
    - cron: '00 19 * * 2,5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the real long-form video to YouTube, Facebook and Instagram trailer?'
        type: boolean
        required: true
        default: false
      youtube_unlisted:
        description: 'Keep the YouTube upload unlisted (use this for the first test).'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unlearn-the-fear-video-pages
  cancel-in-progress: false

jobs:
  reflection:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Determine publishing mode
        id: mode
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(tr -d '[:space:]' < .github/longform-auto-publish.txt)" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .piper-voices
          key: piper-en-us-norman-medium-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - name: Test video helpers
        run: python -m unittest discover -s tests -v
      - name: Render horizontal long-form video and vertical trailer with local narration
        run: python src/video_pipeline.py long
      - name: Commit pending video state only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/video_state.json
          if ! git diff --cached --quiet; then git commit -m 'Prepare long-form reflection'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish long-form master and Reel trailer
        if: steps.mode.outputs.enabled == 'true'
        run: python src/publish_videos.py long ${{ inputs.youtube_unlisted == true && '--youtube-unlisted' || '' }}
      - name: Safe preview
        if: steps.mode.outputs.enabled != 'true'
        run: echo 'Preview only. No platform video was published.'
