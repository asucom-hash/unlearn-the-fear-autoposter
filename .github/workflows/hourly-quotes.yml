name: Weekly Unlearn The Fear quote

on:
  schedule:
    # GitHub Actions cron runs in UTC: Sunday at 08:23 UTC.
    - cron: '23 8 * * 0'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a REAL post to both accounts? Leave OFF for image preview.'
        type: boolean
        required: true
        default: false
      check_credentials:
        description: 'Run read-only checks of both Meta tokens? Does NOT publish.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Serialize both site-publishing workflows: GitHub Pages uses a shared artifact name.
  group: unlearn-the-fear-pages-deploy
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_GITHUB_SECRETS_TOKEN: ${{ secrets.META_GITHUB_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Determine publishing mode
        id: publishing_mode
        # The checked-in flag is the scheduled on/off switch.
        # Manual runs only publish when Publish is explicitly checked.
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f .github/auto-publish.txt ] && [ "$(tr -d '[:space:]' < .github/auto-publish.txt)" = "true" ]; then
            if [ -n "$META_USER_TOKEN" ] && [ -n "$META_APP_ID" ] && [ -n "$META_APP_SECRET" ] && [ -n "$META_GITHUB_SECRETS_TOKEN" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "Weekly image publishing is enabled."
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Publishing is safely paused until Facebook token renewal is configured."
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Manual publishing was explicitly requested."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Preview-only: publishing disabled for this run."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - name: Run offline image tests
        run: python -m unittest discover -s tests -v
      - name: Compile publishing code
        run: python -m py_compile src/publish.py
      - name: Generate or resume pending image
        run: python src/prepare.py
      - name: Commit generated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs state
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare weekly quote image'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      # The artifact API can take a few seconds to index a newly uploaded Pages artifact.
      - name: Wait for Pages artifact availability
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Renew Facebook Page token if due
        if: >-
          steps.publishing_mode.outputs.enabled == 'true' ||
          (github.event_name == 'workflow_dispatch' &&
          (inputs.check_credentials == true || inputs.publish == true))
        run: python src/refresh_facebook_token.py
      - name: Read-only Meta token test (no posting)
        if: github.event_name == 'workflow_dispatch' && inputs.check_credentials == true && inputs.publish != true
        run: python src/check_meta.py
      - name: Publish if explicitly enabled
        if: steps.publishing_mode.outputs.enabled == 'true'
        run: python src/publish.py
      - name: Safe preview (publishing disabled)
        if: steps.publishing_mode.outputs.enabled != 'true'
        run: echo "Safe preview only; no Instagram or Facebook post."
