name: Hourly Unlearn The Fear quotes

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a REAL post to both accounts? Leave OFF for image preview.'
        type: boolean
        required: true
        default: false
      check_credentials:
        description: 'Run read-only checks of both Meta tokens? Does NOT publish.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unlearn-the-fear-quote-pipeline
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      SHOULD_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read scheduled publishing switch
        # A checked-in on/off flag lets connected automation manage the schedule
        # without granting access to repository secrets or admin-only variables.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f .github/auto-publish.txt ] && [ "$(tr -d '[:space:]' < .github/auto-publish.txt)" = "true" ]; then
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
            echo "Automatic quote publishing is enabled."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - name: Run offline image tests
        run: python -m unittest discover -s tests -v
      - name: Generate or resume pending image
        run: python src/prepare.py
      - name: Commit generated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs state
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare next quote image'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Read-only Meta token test (no posting)
        if: github.event_name == 'workflow_dispatch' && inputs.check_credentials == true && inputs.publish != true
        run: python src/check_meta.py
      - name: Publish if explicitly enabled
        if: env.SHOULD_PUBLISH == 'true'
        run: python src/publish.py
      - name: Safe preview (publishing disabled)
        if: env.SHOULD_PUBLISH != 'true'
        run: echo "Safe preview only; no Instagram or Facebook post."
