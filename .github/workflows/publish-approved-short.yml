name: Publish approved Unlearn The Fear Short

on:
  push:
    paths:
      - '.github/publish-approved-short-now'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unlearn-the-fear-approved-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      PIPER_VOICE: en_US-hfc_male-medium
      PIPER_LENGTH_SCALE: '1.30'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .piper-voices
          key: piper-en-us-hfc-male-medium-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - name: Test video helpers
        run: python -m unittest discover -s tests -v
      - name: Render approved vertical Short
        run: python src/video_pipeline.py short
      - name: Commit updated visual credits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/video_state.json
          if ! git diff --cached --quiet; then git commit -m 'Prepare approved video publication'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish approved video to all platforms
        run: python src/publish_videos.py short
