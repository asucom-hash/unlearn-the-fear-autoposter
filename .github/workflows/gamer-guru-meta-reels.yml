name: Publish Gamer Guru Meta Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public direct HTTPS URL to the original vertical MP4 (not a YouTube URL)"
        required: true
        type: string
      title:
        description: "Reel title"
        required: true
        type: string
      caption:
        description: "Caption and up to five relevant hashtags"
        required: true
        type: string
      youtube_url:
        description: "Optional original YouTube Short link"
        required: false
        type: string
      post_key:
        description: "Optional stable key; leave blank to derive one from video_url"
        required: false
        type: string
      publish:
        description: "Publish public native Reels now (off = read-only credential validation)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gamer-guru-meta-reels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      GAMER_GURU_META_PAGE_ID: ${{ vars.GAMER_GURU_META_PAGE_ID }}
      GAMER_GURU_META_IG_USER_ID: ${{ vars.GAMER_GURU_META_IG_USER_ID }}
      GAMER_GURU_META_PAGE_TOKEN: ${{ secrets.GAMER_GURU_META_PAGE_TOKEN }}
      GAMER_GURU_META_IG_TOKEN: ${{ secrets.GAMER_GURU_META_IG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate or publish native Gamer Guru Reels
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          TITLE: ${{ inputs.title }}
          CAPTION: ${{ inputs.caption }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          POST_KEY: ${{ inputs.post_key }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--video-url "$VIDEO_URL" --title "$TITLE" --caption "$CAPTION")
          if [ -n "$YOUTUBE_URL" ]; then args+=(--youtube-url "$YOUTUBE_URL"); fi
          if [ -n "$POST_KEY" ]; then args+=(--post-key "$POST_KEY"); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          python src/gamer_guru_meta.py "${args[@]}"
