name: One-time Unlearn The Fear Facebook recovery

on:
  push:
    paths:
      - '.github/recover-facebook.trigger'

permissions:
  contents: write

concurrency:
  group: unlearn-the-fear-quote-pipeline
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate recovery is for Facebook only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('state/state.json').read_text())
          p=state.get('pending',{})
          if p.get('quote_index')!=1 or not p.get('instagram_post_id') or p.get('facebook_post_id'):
              raise SystemExit('Recovery is not needed or state changed. No posts attempted.')
          print('Quote 2 already published to Instagram; recovering missing Facebook post only.')
          PY
      - name: Finish pending Facebook post (skip existing Instagram post)
        run: python src/publish.py
