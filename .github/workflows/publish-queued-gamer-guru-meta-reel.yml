name: Publish queued Gamer Guru Meta Reel

on:
  push:
    paths:
      - state/gamer-guru-meta-queue.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gamer-guru-meta-reels
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'Queue Gamer Guru Meta post'
    runs-on: ubuntu-latest
    env:
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v27.0' }}
      GAMER_GURU_META_PAGE_ID: ${{ vars.GAMER_GURU_META_PAGE_ID }}
      GAMER_GURU_META_IG_USER_ID: ${{ vars.GAMER_GURU_META_IG_USER_ID }}
      GAMER_GURU_META_PAGE_TOKEN: ${{ secrets.GAMER_GURU_META_PAGE_TOKEN }}
      GAMER_GURU_META_IG_TOKEN: ${{ secrets.GAMER_GURU_META_IG_TOKEN }}
      META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_GITHUB_SECRETS_TOKEN: ${{ secrets.META_GITHUB_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Renew Gamer Guru Meta credentials
        run: python src/refresh_gamer_guru_meta_tokens.py
      - name: Stage the original MP4 on the existing public site
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path

          item = json.loads(Path("state/gamer-guru-meta-queue.json").read_text(encoding="utf-8"))
          if item.get("status") != "ready":
              raise SystemExit("Queue item is not ready; no Reel will be published.")
          filename = "gamer-guru-" + item["post_key"] + ".mp4"
          destination = Path("docs/posts") / filename
          destination.parent.mkdir(parents=True, exist_ok=True)
          with requests.get(item["video_url"], stream=True, timeout=180) as response:
              response.raise_for_status()
              with destination.open("wb") as output:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          output.write(chunk)
          if destination.stat().st_size == 0:
              raise RuntimeError("Downloaded source video is empty.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("file_name=" + filename + "\n")
          PY
      - name: Commit the stable public video source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/posts
          if ! git diff --cached --quiet; then
            git commit -m 'Host Gamer Guru Meta Reel source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Wait for the media artifact
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish the queued native Meta Reel
        env:
          PUBLIC_VIDEO_URL: ${{ steps.deployment.outputs.page_url }}posts/${{ steps.source.outputs.file_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          item = json.loads(Path("state/gamer-guru-meta-queue.json").read_text(encoding="utf-8"))
          if item.get("status") != "ready":
              raise SystemExit("Queue item is not ready; no Reel will be published.")
          args = [
              "python", "src/gamer_guru_meta.py",
              "--video-url", os.environ["PUBLIC_VIDEO_URL"],
              "--title", item["title"],
              "--caption", item["caption"],
              "--youtube-url", item["youtube_url"],
              "--post-key", item["post_key"],
              "--publish",
          ]
          if item.get("instagram_already_published_url"):
              args += ["--instagram-already-published-url", item["instagram_already_published_url"]]
          subprocess.run(args, check=True)
          PY
